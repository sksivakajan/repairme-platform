# HawkScan (StackHawk DAST) config for the RepairMe API.
#
# Scans the API running locally in development (npm run start:dev in apps/api,
# with AUTH_DEV_BYPASS=true). Run from the repo root:
#   hawk scan
#
# Assumptions:
# - The endpoint list comes from the OpenAPI spec the API serves outside
#   production (/openapi.json, generated by @nestjs/swagger).
# - The scan signs in as its own customer account through the development
#   login header, so it never touches real or test users' data.
# - /v1/dev/* are development-only technician simulators (DEV_TOOLS=true);
#   they do not exist in production and act on any booking, so they are excluded.
app:
  applicationId: ${APP_ID:478c61c7-157b-4ef0-b347-85165a346f0e}
  env: ${APP_ENV:Development}
  host: ${APP_HOST:http://localhost:3000}
  openApiConf:
    path: /openapi.json
  excludePaths:
    - "/v1/dev/.*"
    - "/docs.*"
  authentication:
    external:
      values:
        # The whole header value in one variable: HawkScan drops a leading "+"
        # from a value, which would break the +94 phone number after tokenType.
        - type: TOKEN
          value:
            name: Authorization
            val: ${SCAN_USER_AUTH:Dev +94719990001}
    testPath:
      path: /v1/me
      success: ".*200.*"
      requestMethod: GET

tags:
  - name: _STACKHAWK_AGENT
    value: ${HAWK_AGENT:none}
  - name: git_origin
    value: sksivakajan/repairme-platform
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: _STACKHAWK_GIT_BRANCH
    value: ${BRANCH_NAME:none}
